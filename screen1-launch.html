<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>知己 · 你好</title>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+XiaoWei&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    body {
      background: #7878C8;
      font-family: 'ZCOOL XiaoWei', -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      width: 100%;
    }

    .phone-frame {
      width: 390px;
      flex-shrink: 0;
      height: 100vh;
      background: transparent;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ─── 背景渐变 ─── */
    .bg-glow {
      position: fixed;
      top: 0; left: 50%; transform: translateX(-50%);
      width: 390px; height: 100vh;
      pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 340px 320px at 88%  2%,  #F060B0 0%, transparent 55%),
        radial-gradient(ellipse 260px 280px at 60% -5%,  #C040E0 0%, transparent 50%),
        radial-gradient(ellipse 280px 260px at 5%  10%,  #8040D0 0%, transparent 52%),
        radial-gradient(ellipse 320px 340px at 45%  48%, #4060E8 0%, transparent 58%),
        radial-gradient(ellipse 300px 260px at 15%  72%, #30C0C0 0%, transparent 55%),
        radial-gradient(ellipse 240px 220px at 82%  68%, #6080E0 0%, transparent 50%),
        radial-gradient(ellipse 200px 200px at 50%  90%, #50A8D8 0%, transparent 50%);
      background-color: #7878C8;
    }

    /* ─── 顶部状态栏占位 ─── */
    .status-bar {
      position: relative; z-index: 5;
      padding: 54px 22px 12px;
      display: flex; align-items: center; gap: 10px;
    }
    .avatar-wrap {
      width: 38px; height: 38px; border-radius: 13px;
      background: linear-gradient(135deg, #C890E8, #8B4FC8);
      overflow: hidden; flex-shrink: 0;
      box-shadow: 0 2px 12px rgba(160,80,220,0.32);
      position: relative;
    }
    .avatar-svg { width: 100%; height: 100%; display: block; }
    .online-dot {
      position: absolute; bottom: -1px; right: -1px;
      width: 10px; height: 10px; border-radius: 50%;
      background: #60E8A0;
      border: 2px solid rgba(120,120,200,0.9);
      box-shadow: 0 0 5px rgba(80,220,140,0.65);
    }
    .name-col {}
    .ai-name {
      font-size: 15px; color: rgba(255,255,255,0.94);
      letter-spacing: 1px;
    }
    .ai-status {
      font-size: 11px; color: rgba(255,255,255,0.42);
      letter-spacing: 0.3px; margin-top: 1px;
    }

    /* ─── 右上角注册胶囊 ─── */
    .reg-pill {
      margin-left: auto;
      background: linear-gradient(135deg, #B060E8, #8038C8);
      border: none;
      border-radius: 20px; padding: 7px 16px;
      font-size: 12px; color: #fff;
      letter-spacing: 0.5px; cursor: pointer;
      box-shadow: 0 2px 12px rgba(140,50,210,0.45);
      transition: opacity 0.15s ease;
      white-space: nowrap;
    }
    .reg-pill:active { opacity: 0.82; }

    /* ─── 消息列表 ─── */
    .msg-list {
      position: relative; z-index: 2;
      flex: 1;
      padding: 8px 18px 0;
      display: flex; flex-direction: column; gap: 10px;
      overflow: hidden;
    }

    /* 知己消息行：头像 + 气泡 */
    .msg-row {
      display: flex; align-items: flex-end; gap: 10px;
      opacity: 0; transform: translateY(10px);
      transition: opacity 0.38s ease, transform 0.38s ease;
    }
    .msg-row.visible { opacity: 1; transform: translateY(0); }

    .msg-avatar {
      width: 30px; height: 30px; border-radius: 10px;
      background: linear-gradient(135deg, #C890E8, #8B4FC8);
      overflow: hidden; flex-shrink: 0;
      box-shadow: 0 2px 8px rgba(160,80,220,0.28);
    }
    .msg-avatar-svg { width: 100%; height: 100%; display: block; }

    .ai-bubble {
      max-width: 276px;
      background: rgba(255,255,255,0.84);
      border: 1px solid rgba(160,100,240,0.12);
      border-radius: 4px 18px 18px 18px;
      padding: 12px 16px;
      backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 2px 14px rgba(120,60,200,0.09);
    }
    .ai-bubble-text {
      font-size: 15px; color: #1E1440;
      line-height: 1.78; letter-spacing: 0.2px;
    }
    .ai-bubble-text .hl { color: #7030B8; font-weight: 500; }

    /* 打字动画气泡 */
    .typing-bubble {
      max-width: 70px;
      background: rgba(255,255,255,0.84);
      border: 1px solid rgba(160,100,240,0.12);
      border-radius: 4px 18px 18px 18px;
      padding: 13px 16px;
      display: flex; align-items: center; gap: 5px;
    }
    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: rgba(120,60,200,0.45);
      animation: bounce 1.1s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.18s; }
    .dot:nth-child(3) { animation-delay: 0.36s; }
    @keyframes bounce {
      0%,60%,100% { transform: translateY(0); opacity: 0.45; }
      30%          { transform: translateY(-4px); opacity: 1; }
    }

    /* 打字光标 */
    .cursor {
      display: inline-block;
      width: 2px; height: 1em;
      background: #9040C8;
      margin-left: 1px;
      vertical-align: text-bottom;
      animation: blink 0.8s step-end infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .cursor.done { display: none; }

    /* ─── 底部 CTA 区 ─── */
    .bottom-zone {
      position: relative; z-index: 2;
      padding: 14px 18px 38px;
      display: flex; flex-direction: column; gap: 12px;
      opacity: 0; transform: translateY(12px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }
    .bottom-zone.visible { opacity: 1; transform: translateY(0); }

    /* ─── 选项卡片 ─── */
    .option-card {
      background: rgba(255,255,255,0.18);
      border: 1.5px solid rgba(255,255,255,0.38);
      border-radius: 18px; padding: 16px 18px;
      cursor: pointer;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 4px 20px rgba(60,20,140,0.18), 0 1px 0 rgba(255,255,255,0.28) inset;
      display: flex; align-items: center; gap: 12px;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }
    .option-card:active {
      transform: scale(0.972);
      background: rgba(255,255,255,0.28);
      box-shadow: 0 2px 10px rgba(60,20,140,0.22);
    }

    .opt-icon {
      width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .icon-story  { background: linear-gradient(135deg, #E090A0, #C05070); box-shadow: 0 3px 12px rgba(200,80,110,0.30); }
    .icon-assess { background: linear-gradient(135deg, #B070E8, #7840C0); box-shadow: 0 3px 12px rgba(160,80,220,0.32); }
    .icon-chat   { background: linear-gradient(135deg, #70C0D8, #4090B8); box-shadow: 0 3px 12px rgba(70,150,200,0.30); }

    .opt-body { flex: 1; min-width: 0; }
    .opt-title {
      font-size: 15px; color: rgba(255,255,255,0.95);
      letter-spacing: 0.3px; line-height: 1.3; margin-bottom: 4px;
    }
    .opt-desc {
      font-size: 12px; color: rgba(255,255,255,0.55);
      line-height: 1.6; letter-spacing: 0.2px;
    }
    .opt-arrow {
      color: rgba(255,255,255,0.45); font-size: 20px;
      align-self: center; flex-shrink: 0;
    }

    /* ─── 等待状态（呼吸动效） ─── */
    .waiting-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding-bottom: 40px;
      opacity: 1;
      transition: opacity 0.3s ease;
    }
    .waiting-state.hide { opacity: 0; pointer-events: none; }

    .waiting-avatar {
      width: 62px; height: 62px; border-radius: 22px;
      background: linear-gradient(135deg, #C890E8, #8B4FC8);
      overflow: hidden;
      opacity: 0.55;
      box-shadow: 0 0 0 0 rgba(180,100,240,0.38);
      animation: breathe 3s ease-in-out infinite;
    }
    .waiting-avatar svg { width: 100%; height: 100%; display: block; }

    .waiting-label {
      font-size: 12px;
      color: rgba(255,255,255,0.32);
      letter-spacing: 1px;
      animation: fade-pulse 3s ease-in-out infinite;
    }

    @keyframes breathe {
      0%,100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(180,100,240,0.38);
        opacity: 0.55;
      }
      50% {
        transform: scale(1.07);
        box-shadow: 0 0 0 10px rgba(180,100,240,0);
        opacity: 0.75;
      }
    }
    @keyframes fade-pulse {
      0%,100% { opacity: 0.32; }
      50%      { opacity: 0.55; }
    }

  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <!-- 知己头像 SVG symbol -->
  <svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
    <defs>
      <radialGradient id="fg1" cx="50%" cy="45%" r="55%">
        <stop offset="0%" stop-color="#FFFFFF"/>
        <stop offset="100%" stop-color="#EDE0F8"/>
      </radialGradient>
      <radialGradient id="cg1" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FAF0FF" stop-opacity="0.9"/>
        <stop offset="100%" stop-color="#E8D4F4" stop-opacity="0.6"/>
      </radialGradient>
      <radialGradient id="eg1" cx="38%" cy="35%" r="60%">
        <stop offset="0%" stop-color="#5C3A8A"/>
        <stop offset="100%" stop-color="#2A1040"/>
      </radialGradient>
      <linearGradient id="sg1" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FFE566"/>
        <stop offset="100%" stop-color="#E090FF"/>
      </linearGradient>
      <filter id="glow1" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="1.5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
      <symbol id="zj1" viewBox="0 0 100 100">
        <ellipse cx="21" cy="40" rx="16" ry="20" fill="url(#fg1)" opacity="0.9"/>
        <ellipse cx="79" cy="40" rx="16" ry="20" fill="url(#fg1)" opacity="0.9"/>
        <ellipse cx="50" cy="24" rx="22" ry="16" fill="url(#fg1)" opacity="0.85"/>
        <ellipse cx="18" cy="62" rx="14" ry="12" fill="url(#cg1)"/>
        <ellipse cx="82" cy="62" rx="14" ry="12" fill="url(#cg1)"/>
        <circle cx="50" cy="55" r="32" fill="url(#fg1)"/>
        <circle cx="38" cy="50" r="6" fill="url(#eg1)"/>
        <circle cx="62" cy="50" r="6" fill="url(#eg1)"/>
        <circle cx="40.5" cy="47.5" r="2" fill="white" opacity="0.85"/>
        <circle cx="64.5" cy="47.5" r="2" fill="white" opacity="0.85"/>
        <ellipse cx="50" cy="61" rx="5" ry="3.5" fill="#3A1A5A"/>
        <path d="M44 66 Q50 71 56 66" stroke="#5A3070" stroke-width="1.8" fill="none" stroke-linecap="round"/>
        <g filter="url(#glow1)">
          <path d="M50 10 L52 16 L58 16 L53 20 L55 26 L50 22 L45 26 L47 20 L42 16 L48 16 Z" fill="url(#sg1)" opacity="0.95"/>
        </g>
        <circle cx="70" cy="18" r="2.2" fill="#FFE566" opacity="0.8"/>
        <circle cx="76" cy="24" r="1.4" fill="#E090FF" opacity="0.7"/>
      </symbol>
    </defs>
  </svg>

  <div class="phone-frame">

    <!-- 顶部：知己名片栏 -->
    <div class="status-bar">
      <div class="avatar-wrap">
        <div class="online-dot"></div>
        <svg class="avatar-svg" viewBox="0 0 100 100"><use href="#zj1"/></svg>
      </div>
      <div class="name-col">
        <div class="ai-name">知己</div>
        <div class="ai-status">任何时候，我都在</div>
      </div>
      <div class="reg-pill" onclick="localStorage.setItem('zjRegSource','no_assess'); window.location.href='screen5-register.html'">注册</div>
    </div>

    <!-- 消息列表 -->
    <div class="msg-list" id="msgList">
      <!-- 等待状态：呼吸头像 -->
      <div class="waiting-state" id="waitingState">
        <div class="waiting-avatar">
          <svg viewBox="0 0 100 100"><use href="#zj1"/></svg>
        </div>
        <div class="waiting-label">它在等你……</div>
      </div>
    </div>

    <!-- 底部三选项 -->
    <div class="bottom-zone" id="bottomZone">

      <div class="option-card" onclick="goAssess()">
        <div class="opt-icon icon-assess">✦</div>
        <div class="opt-body">
          <div class="opt-title">用 5 分钟让我真正了解你</div>
          <div class="opt-desc">了解你后，我说的每句话都不会泛泛而谈</div>
        </div>
        <div class="opt-arrow">›</div>
      </div>

      <div class="option-card" onclick="goChat()">
        <div class="opt-icon icon-chat">🌊</div>
        <div class="opt-body">
          <div class="opt-title">先随便聊聊</div>
          <div class="opt-desc">不想那么正式，就是想说说话</div>
        </div>
        <div class="opt-arrow">›</div>
      </div>

      <div class="option-card" onclick="goStory()">
        <div class="opt-icon icon-story">💬</div>
        <div class="opt-body">
          <div class="opt-title">先看看知己如何帮助其他人</div>
          <div class="opt-desc">看看我能做什么，再决定要不要深入</div>
        </div>
        <div class="opt-arrow">›</div>
      </div>

    </div>

    <!-- 重置入口（开发调试用）-->
    <div style="text-align:center; margin-top:20px; padding-bottom:env(safe-area-inset-bottom,0px);">
      <span onclick="doReset()"
        style="display:inline-block; font-size:12px; color:rgba(255,255,255,0.38); cursor:pointer; letter-spacing:0.5px; user-select:none; padding:6px 16px; border:1px solid rgba(255,255,255,0.18); border-radius:20px; background:rgba(255,255,255,0.06); -webkit-tap-highlight-color:transparent;"
        title="清空所有数据，重新开始">
        重新开始
      </span>
    </div>

  </div>

  <script>
    /* 每条消息的配置 */
    const MESSAGES = [
      { text: 'Hi，朋友 👋', speed: 60, pauseAfter: 320 },
      { text: '你有多久\n没有被人<span class="hl">真正懂过</span>了？', speed: 40, pauseAfter: 400 },
      { text: '你有任何烦恼，我都<span class="hl">愿意听</span>', speed: 40, pauseAfter: 0 },
    ];

    /* 解析含 HTML 标签的字符串（保留标签完整） */
    function parseSegments(html) {
      const parts = [];
      const re = /(<[^>]+>[\s\S]*?<\/[^>]+>|<[^\/][^>]*\/>|<[^>]+>)/g;
      let last = 0, m;
      while ((m = re.exec(html)) !== null) {
        if (m.index > last) parts.push({ type: 'text', val: html.slice(last, m.index) });
        parts.push({ type: 'tag', val: m[0] });
        last = re.lastIndex;
      }
      if (last < html.length) parts.push({ type: 'text', val: html.slice(last) });
      return parts;
    }

    /* 打字机 */
    function typewrite(el, html, speed, onDone) {
      const normalized = html.replace(/\n/g, '<br>');
      const segs = parseSegments(normalized);
      let out = '', si = 0, ci = 0;
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      el.appendChild(cursor);

      function tick() {
        if (si >= segs.length) { cursor.classList.add('done'); onDone && onDone(); return; }
        const s = segs[si];
        if (s.type === 'tag') {
          out += s.val; si++;
          el.innerHTML = out; el.appendChild(cursor); tick();
        } else {
          if (ci < s.val.length) {
            out += s.val[ci++]; el.innerHTML = out; el.appendChild(cursor);
            setTimeout(tick, speed);
          } else { si++; ci = 0; tick(); }
        }
      }
      tick();
    }

    /* 插入一个打字中动画行 */
    function makeTypingRow() {
      const row = document.createElement('div');
      row.className = 'msg-row';
      row.innerHTML = `
        <div class="msg-avatar"><svg class="msg-avatar-svg" viewBox="0 0 100 100"><use href="#zj1"/></svg></div>
        <div class="typing-bubble">
          <div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>`;
      return row;
    }

    /* 插入真实消息行 */
    function makeMsgRow() {
      const row = document.createElement('div');
      row.className = 'msg-row';
      const bubbleEl = document.createElement('div');
      bubbleEl.className = 'ai-bubble';
      const textEl = document.createElement('div');
      textEl.className = 'ai-bubble-text';
      bubbleEl.appendChild(textEl);
      row.innerHTML = `<div class="msg-avatar"><svg class="msg-avatar-svg" viewBox="0 0 100 100"><use href="#zj1"/></svg></div>`;
      row.appendChild(bubbleEl);
      return { row, textEl };
    }

    /* 逐条播放 */
    function playMessages(list, idx, onAllDone) {
      if (idx >= list.length) { onAllDone && onAllDone(); return; }
      const msg = list[idx];
      const container = document.getElementById('msgList');

      // 第一条消息开始时，淡出等待状态
      if (idx === 0) {
        const waiting = document.getElementById('waitingState');
        if (waiting) {
          waiting.classList.add('hide');
          setTimeout(() => waiting.remove(), 320);
        }
      }

      // 先显示打字动画
      const typingRow = makeTypingRow();
      container.appendChild(typingRow);
      setTimeout(() => typingRow.classList.add('visible'), 20);

      const typingDuration = 500 + msg.text.replace(/<[^>]+>/g, '').length * 18;

      setTimeout(() => {
        // 移除打字动画
        typingRow.remove();

        // 插入真实消息
        const { row, textEl } = makeMsgRow();
        container.appendChild(row);
        setTimeout(() => row.classList.add('visible'), 20);

        // 打字机
        typewrite(textEl, msg.text, msg.speed, () => {
          setTimeout(() => {
            playMessages(list, idx + 1, onAllDone);
          }, msg.pauseAfter);
        });

      }, typingDuration);
    }

    // 重新开始：清空全部知己数据，回到 screen1
    function doReset() {
      // 清除所有已知 key（比 localStorage.clear() 更安全，不误清其他站点数据）
      const ALL_KEYS = [
        'zjChatLog','zjIsRegistered','zjAssessment','zjRegSource',
        'zjMidScreen','zjUserName','zjUserNickname','zjAiName',
        'zjRegNudgeDismissed','zhiji_reactions','zjDiaryLog',
      ];
      ALL_KEYS.forEach(k => localStorage.removeItem(k));
      // 清除所有 zjDiaryClips_* 动态日期 key
      Object.keys(localStorage).filter(k => k.startsWith('zjDiaryClips_')).forEach(k => localStorage.removeItem(k));
      // 跳回首页（强制刷新，清掉内存中的 chatHistory 等变量）
      window.location.replace('screen1-launch.html');
    }

    // ?reset=1 → 同上（URL 参数触发版）
    (function() {
      if (new URLSearchParams(window.location.search).get('reset') === '1') {
        doReset();
      }
    })();

    /* 启动 */
    window.addEventListener('DOMContentLoaded', () => {
      // ?reset=1 已由上方 IIFE 处理，此处仅清理 URL 参数
      if (new URLSearchParams(location.search).get('reset') === '1') {
        history.replaceState(null, '', location.pathname);
      }

      // 已注册用户：直接跳到聊天页，不走新手流程
      // 如果带 ?dev=1 参数则跳过自动跳转，方便测试
      const isDev = new URLSearchParams(location.search).get('dev') === '1';
      if (!isDev && localStorage.getItem('zjIsRegistered')) {
        window.location.replace('screen6-chat.html');
        return;
      }

      // 已注册则隐藏注册胶囊
      if (localStorage.getItem('zjIsRegistered')) {
        document.querySelectorAll('.reg-pill').forEach(el => el.style.display = 'none');
      }

      setTimeout(() => {
        playMessages(MESSAGES, 0, () => {
          // 全部消息打完，显示按钮
          setTimeout(() => {
            document.getElementById('bottomZone').classList.add('visible');
          }, 300);
        });
      }, 500);
    });

    function goStory()  { window.location.href = 'screen-story.html'; }
    function goAssess() { localStorage.removeItem('zjChatLog'); window.location.href = 'screen3-prototype.html'; }
    function goChat()   {
      if (localStorage.getItem('zjIsRegistered')) {
        window.location.href = 'screen6-chat.html';
      } else {
        localStorage.removeItem('zjChatLog');
        window.location.href = 'screen4-report.html?mode=chat';
      }
    }
  </script>
</body>
</html>
